services:
  # Backend FastAPI Web Service on Render
  - type: web
    name: datalens-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: google
      - key: DEFAULT_LLM_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app,http://localhost:3000

